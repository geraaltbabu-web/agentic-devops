stages: [test, deploy]
test:
  stage: test
  script: ["echo tests"]
  rules: [{if: '$CI_PIPELINE_SOURCE == "merge_request_event"'}]
deploy_prod:
  stage: deploy
  script: ["echo deploy-same-sha"]
  environment: {name: production}
  rules: [{if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'}]
  when: manual
