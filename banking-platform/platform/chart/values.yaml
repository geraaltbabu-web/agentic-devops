global:
  registry: ghcr.io/demo
  tag: "1.0.0"
  environment: dev
  replicas: 1
services: [accounts, payments, ledger, fraud, notifications]
gateway:
  enabled: true
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 256Mi}
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPU: 70
networkPolicy:
  enabled: true
