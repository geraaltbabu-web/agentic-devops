x-service: &service
  build: .
  restart: unless-stopped
  networks: [banking]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
    interval: 10s
    timeout: 3s
    retries: 5

services:
  accounts:
    <<: *service
    environment: {SERVICE_NAME: accounts}
  payments:
    <<: *service
    environment: {SERVICE_NAME: payments}
  ledger:
    <<: *service
    environment: {SERVICE_NAME: ledger}
  fraud:
    <<: *service
    environment: {SERVICE_NAME: fraud}
  notifications:
    <<: *service
    environment: {SERVICE_NAME: notifications}
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [accounts, payments, ledger, fraud, notifications]
    networks: [banking]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    profiles: [observability]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    networks: [banking]
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    profiles: [observability]
    volumes: ["./observability/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    ports: ["5044:5044", "9600:9600"]
    depends_on: [elasticsearch]
    networks: [banking]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    profiles: [observability]
    environment: {ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"}
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
    networks: [banking]
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    profiles: [observability]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - "./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on: [logstash]
    networks: [banking]

networks:
  banking: {}
volumes:
  esdata: {}
