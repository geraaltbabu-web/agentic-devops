events {}
http {
  log_format json escape=json '{"time":"$time_iso8601","service":"gateway","method":"$request_method","uri":"$uri","status":$status,"request_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  upstream accounts { server accounts:8080; }
  upstream payments { server payments:8080; }
  upstream ledger { server ledger:8080; }
  upstream fraud { server fraud:8080; }
  upstream notifications { server notifications:8080; }

  server {
    listen 8080;
    location = /health { return 200 '{"status":"ok","service":"gateway"}'; add_header Content-Type application/json; }
    location /api/accounts { proxy_pass http://accounts/accounts; proxy_set_header X-Correlation-ID $request_id; }
    location /api/payments { proxy_pass http://payments/payments; proxy_set_header X-Correlation-ID $request_id; }
    location /api/transactions { proxy_pass http://ledger/transactions; proxy_set_header X-Correlation-ID $request_id; }
    location /api/risk { proxy_pass http://fraud/risk; proxy_set_header X-Correlation-ID $request_id; }
    location /api/notifications { proxy_pass http://notifications/notifications; proxy_set_header X-Correlation-ID $request_id; }
  }
}
