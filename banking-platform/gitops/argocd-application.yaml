apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banking-platform
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/geraaltbabu-web/agentic-devops.git
    targetRevision: main
    path: banking-platform/platform/chart
    helm:
      valueFiles: [../environments/dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: banking-dev
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
