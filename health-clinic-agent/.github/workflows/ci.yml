name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Agent plan (no apply)
        env:
          PYTHONPATH: ${{ github.workspace }}
          AGENT_SIMULATE: "1"
        run: python -m agent plan --env staging --image clinic-api:1.1.0 --json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t clinic-api:ci .
      - name: Build agent image
        run: docker build -f Dockerfile.agent -t agentic-devops-agent:ci .
